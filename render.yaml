services:
  # Backend Service
  - type: web
    name: parknow-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: parknow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MQTT_PORT
        value: 1883
      - key: MQTT_WS_PORT
        value: 8883
    healthCheckPath: /api/health

databases:
  # PostgreSQL Database
  - name: parknow-db
    databaseName: parknow
    user: parknow
    plan: free
    region: oregon
