name: Deploy Production (Main)

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite ejecución manual

# Limitar ejecuciones concurrentes para ahorrar minutos
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Tests y Validación
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Límite de tiempo para evitar consumo excesivo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps
      
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --prefer-offline --no-audit
      
      # - name: Run Frontend Tests
      #   working-directory: ./frontend
      #   run: npm test -- --passWithNoTests
      
      # - name: Run Backend Tests
      #   working-directory: ./backend
      #   run: npm test -- --passWithNoTests
      
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint --if-present || echo "No lint script found"
      
      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint --if-present || echo "No lint script found"

  # Job 2: Build Frontend
  build-frontend:
    name: Build Frontend
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps
      
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
          CI: false # Evita que warnings se traten como errores
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1 # Solo 1 día para ahorrar espacio

  # Job 3: Deploy Frontend a Vercel
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      
      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

  # Job 4: Deploy Backend a Render (100% Gratis)
  deploy-backend:
    name: Deploy Backend to Render
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  # Job 5: Notificación de éxito
  notify:
    name: Notify Success
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Send Success Notification
        run: |
          echo "✅ Deployment to PRODUCTION successful!"
          echo "Frontend: Deployed to Vercel"
          echo "Backend: Deployed to Railway"
