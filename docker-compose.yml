version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: parknow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parqueadero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d parqueadero_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
